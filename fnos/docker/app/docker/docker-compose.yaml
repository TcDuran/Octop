services:
  octop:
    image: ghcr.io/tencentcloud/octop:1.0.2
    container_name: octop
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    pull_policy: missing
    ports:
      - "8088:8088"
    # 官方镜像 entrypoint 读不到飞牛向导密码（.env 不在 @appcenter）。
    # 改用 data-share 上的引导脚本：每次启动用向导密码 init 或 passwd。
    entrypoint: ["bash", "/usr/local/bin/fnos-boot.sh"]
    volumes:
      - "${TRIM_DATA_SHARE_PATHS}/.octop:/data/.octop"
      - "${TRIM_DATA_SHARE_PATHS}/fnos-boot.sh:/usr/local/bin/fnos-boot.sh:ro"
      - "${TRIM_DATA_SHARE_PATHS}/fnos-admin.env:/data/fnos-admin.env:ro"
    environment:
      - HOME=/data
      - OCTOP_HOME=/data/.octop
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=${OCTOP_PORT:-8088}
      - OCTOP_LOG_LEVEL=${OCTOP_LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,urllib.request; from octop.config import load_config; from octop.infra.utils.paths import PathLayout; from octop.infra.utils.env_file import apply_env_file, env_file_path; p=PathLayout.from_env(); apply_env_file(env_file_path(p.root)); c=load_config(p.config); r=json.load(urllib.request.urlopen(f'http://127.0.0.1:{c.port}{c.base_path}/api/health', timeout=3)); raise SystemExit(0 if r.get('users_loaded', 0) >= 1 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
