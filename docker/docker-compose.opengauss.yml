# 独立开发环境；完成 openGauss 适配和初始化验收后使用。
# 在 worktree 根目录执行（凭证只从本地忽略文件载入）：
#   ( source .env.opengauss; docker compose -f docker/docker-compose.opengauss.yml up -d --build )
name: octop-opengauss

services:
  octop-opengauss:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: opengauss-runtime
    image: octop-opengauss:dev
    container_name: octop-opengauss
    restart: "no"
    ports:
      - "127.0.0.1:18088:18088"
    volumes:
      - ../data/opengauss/docker-home:/data/.octop
    environment:
      HOME: /data
      OCTOP_HOME: /data/.octop
      OCTOP_BIND_HOST: 0.0.0.0
      OCTOP_PORT: "18088"
      OCTOP_DATABASE_DRIVER: opengauss
      OCTOP_DATABASE_HOST: ${OCTOP_DATABASE_HOST:?load .env.opengauss first}
      OCTOP_DATABASE_PORT: ${OCTOP_DATABASE_PORT:?load .env.opengauss first}
      OCTOP_DATABASE_NAME: octop
      OCTOP_DATABASE_USER: ${OCTOP_DATABASE_USER:?load .env.opengauss first}
      OCTOP_DATABASE_PASSWORD: ${OCTOP_DATABASE_PASSWORD:?load .env.opengauss first}
