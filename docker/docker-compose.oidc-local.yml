# Local PLAT integration only. Keep the existing loopback issuer reachable from
# Octop's container without changing its OIDC code or existing identity bindings.
# Start with the active Octop compose file so the proxy shares its network namespace.
# PLAT must listen on the host at port 8080.
# For PostgreSQL:
# docker compose -f docker/docker-compose.yml -f docker/docker-compose.oidc-local.yml up -d
# For openGauss, include docker-compose.opengauss-local.yml instead.
# Production should use a provider hostname reachable from browser and container.
services:
  plat-oidc-loopback:
    image: octop:latest
    container_name: octop-plat-oidc-loopback
    restart: unless-stopped
    depends_on:
      - octop
    network_mode: service:octop
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:8080/service/.well-known/openid-configuration >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    entrypoint: ["python", "-u", "-c"]
    command:
      - |
        import asyncio

        async def forward(reader, writer):
            try:
                while data := await reader.read(65536):
                    writer.write(data)
                    await writer.drain()
            finally:
                writer.close()

        async def connect(reader, writer):
            try:
                remote_reader, remote_writer = await asyncio.open_connection(
                    "host.docker.internal", 8080
                )
                await asyncio.gather(
                    forward(reader, remote_writer), forward(remote_reader, writer)
                )
            except (OSError, ConnectionError) as error:
                print(f"PLAT forwarding failed: {error}", flush=True)
                writer.close()

        async def main():
            server = await asyncio.start_server(connect, "127.0.0.1", 8080)
            async with server:
                await server.serve_forever()

        asyncio.run(main())
